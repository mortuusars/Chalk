architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    implementation("net.fabricmc:fabric-loader:$rootProject.fabric_loader_version")

    compileOnly("io.github.mortuusars.mortaar:mortaar-${minecraft_version}-common:${mortaar_version}")
    api("fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:${forge_config_api_port_version}")

    compileOnlyApi("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")

    // Needed for mixins into JEI for advanced compat
    // compileOnly("mezz.jei:jei-${minecraft_version}-common:${jei_version}")
    // compileOnly("mezz.jei:jei-${minecraft_version}-lib:${jei_version}")
    // compileOnly("mezz.jei:jei-${minecraft_version}-gui:${jei_version}")

    testImplementation("org.junit.jupiter:junit-jupiter:5.7.1")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

tasks {
    test {
        useJUnitPlatform()
    }
}

// Makes datagenerated resources usable:
sourceSets {
    main {
        // We are using NeoForge to datagen, and it outputs to the 'common/src/generated' folder
        resources.srcDir file("src/generated/resources")
    }
}