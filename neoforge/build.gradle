plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge("net.neoforged:neoforge:${neoforge_version}")

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(include("io.github.llamalad7:mixinextras-neoforge:0.4.1"))

    modImplementation(include("io.github.mortuusars.mortaar:mortaar-${minecraft_version}-neoforge:${mortaar_version}"))

    modLocalRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }

    modLocalRuntime("maven.modrinth:jade:${jade_version}+neoforge") { transitive = false }
    modLocalRuntime("maven.modrinth:better-advancements:FjTYILOi")
    modLocalRuntime("maven.modrinth:simplefog:ywT5urX0")
    modLocalRuntime("maven.modrinth:cloth-config:izKINKFg")

    modLocalRuntime("curse.maven:embeddium-908741:6118392")

    modLocalRuntime("tschipp.carryon:carryon-neoforge-${minecraft_version}:${carry_on_version}")

    // modImplementation("curse.maven:dyenamics-509276:9011797")
    // modImplementation("maven.modrinth:dye-depot:9aHqSxUo")

    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowBundle(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }
}

loom {
    accessWidenerPath.set(project(":common").loom.accessWidenerPath)

    runs {
        create("client2") {
            inherit(getByName("client"))

            name("Second Client")
            programArgs("--username", "AnotherDev")

            client()
        }

        data {
            data()
            programArgs "--all", "--mod", "${mod_id}"
            programArgs "--output", project(':common').file("src/generated/resources").absolutePath // Outputs to common project
            programArgs "--existing", project(':common').file("src/main/resources").absolutePath // Makes datagen see resources from common folder
        }

        exportClient {
            client()
            property('wiki_exporter.enabled', 'true')
        }
        exportServer {
            server()
            programArgs('nogui')
            property('wiki_exporter.enabled', 'true')
        }
    }
}

shadowJar {
    exclude("architectury.common.json")
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    injectAccessWidener = true
    atAccessWideners.add(loom.accessWidenerPath.get().asFile.name)
    inputFile.set shadowJar.archiveFile
}